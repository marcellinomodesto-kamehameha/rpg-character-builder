<section class="classes-page">
  <div class="classes-container">

    <div class="classes-header">
      <h1>Choose a Character Class</h1>

      <p>
        Select a class to learn more about its strengths and play style.
      </p>
    </div>

    <div class="class-grid">
      @for (characterClass of characterClasses; track characterClass.id) {
        <article class="class-card">

          <div class="class-card-content">
            <h2>{{ characterClass.name }}</h2>

            <p>
              {{ characterClass.description }}
            </p>
          </div>

          <a
            [routerLink]="['/classes', characterClass.id]"
            class="class-button">
            View Details
          </a>

        </article>
      }
    </div>

  </div>
</section>
